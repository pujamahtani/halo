<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0b0b0c"/>
  <!-- subtle halo rings -->
  <circle cx="600" cy="315" r="300" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="600" cy="315" r="220" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="600" cy="315" r="140" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- mark -->
  <g transform="translate(96, 92)">
    <circle cx="26" cy="26" r="26" fill="#fafafa"/>
    <circle cx="26" cy="26" r="13" stroke="#0b0b0c" stroke-width="3.5" stroke-opacity="0.5"/>
    <circle cx="26" cy="26" r="5" fill="#0b0b0c"/>
    <text x="70" y="36" font-size="30" font-weight="600" fill="#fafafa" letter-spacing="-0.5">Halo</text>
  </g>

  <!-- headline -->
  <text x="96" y="300" font-size="76" font-weight="600" fill="#fafafa" letter-spacing="-2.5">A trust layer for</text>
  <text x="96" y="384" font-size="76" font-weight="600" fill="#fafafa" letter-spacing="-2.5">AI interfaces</text>

  <!-- subhead -->
  <text x="98" y="446" font-size="27" fill="#a3a3a3" letter-spacing="-0.3">12 React components for AI that acts inside your product,</text>
  <text x="98" y="484" font-size="27" fill="#a3a3a3" letter-spacing="-0.3">not just inside a chat.</text>

  <!-- meta row -->
  <g transform="translate(96, 548)" font-size="20" fill="#6f6f6f">
    <text x="0" y="0">npm i @pujamahtani/halo</text>
    <text x="320" y="0" fill="#3a3a40">/</text>
    <text x="344" y="0">React 19 + TypeScript</text>
    <text x="620" y="0" fill="#3a3a40">/</text>
    <text x="644" y="0">MIT</text>
  </g>
</svg>
